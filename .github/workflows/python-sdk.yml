name: Python SDK

on:
  push:
    branches: [main]
    tags: ["python-sdk-v*"]
    paths: ["python-sdk/**", ".github/workflows/python-sdk.yml"]
  pull_request:
    branches: [main]
    paths: ["python-sdk/**", ".github/workflows/python-sdk.yml"]

permissions:
  contents: read

defaults:
  run:
    working-directory: python-sdk

jobs:
  test:
    if: github.repository == 'liegeagents/liegeagentsapp'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[test,build]"
      - run: python -m pytest
      - run: python -m build

  publish:
    if: github.repository == 'liegeagents/liegeagentsapp' && startsWith(github.ref, 'refs/tags/python-sdk-v')
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/liege-agent-sdk
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python-sdk/dist/
