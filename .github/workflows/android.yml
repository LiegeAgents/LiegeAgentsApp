name: Android companion

on:
  push:
    tags: ["android-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.repository == 'liegeagents/liegeagentsapp'
    runs-on: ubuntu-latest
    environment: android-release
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@1e60f620b9541dca7c1b9dcf6a8c8ec1d1e0a4e # v4
        with: { node-version: 22 }
      - uses: actions/setup-java@17beec9f8f7a45b6e10a2e0d0b9cc8c1b2a6c2c4 # v4
        with: { distribution: temurin, java-version: "17" }
      - run: npm install
      - run: npx expo prebuild --platform android --no-install
      - name: Configure release signing
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE" && test -n "$ANDROID_KEYSTORE_PASSWORD" && test -n "$ANDROID_KEY_ALIAS" && test -n "$ANDROID_KEY_PASSWORD"
          echo "$KEYSTORE" | base64 --decode > android/app/liege-release.p12
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle')
          s = p.read_text()
          s = s.replace('signingConfig signingConfigs.debug', 'signingConfig signingConfigs.release')
          marker = '    signingConfigs {\n'
          block = '''    signingConfigs {\n        release {\n            storeFile file("liege-release.p12")\n            storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")\n            keyAlias System.getenv("ANDROID_KEY_ALIAS")\n            keyPassword System.getenv("ANDROID_KEY_PASSWORD")\n            storeType "pkcs12"\n        }\n'''
          if marker not in s: raise SystemExit('signingConfigs block not found')
          s = s.replace(marker, block, 1)
          p.write_text(s)
          PY
      - run: cd android && ./gradlew assembleRelease
      - run: cp android/app/build/outputs/apk/release/app-release.apk liege-mobile.apk
      - uses: actions/upload-artifact@v4
        with: { name: liege-mobile-apk, path: android/liege-mobile.apk, retention-days: 1 }
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/android-v')
        uses: softprops/action-gh-release@v2
        with: { files: android/liege-mobile.apk, generate_release_notes: true }
