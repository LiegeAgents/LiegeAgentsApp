name: Super Agents runtime

on:
  push:
    branches: [main]
    paths: ["superagents-agents/**", ".github/workflows/superagents-agents.yml"]
  pull_request:
    paths: ["superagents-agents/**", ".github/workflows/superagents-agents.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    if: github.repository == 'liegeagents/liegeagentsapp'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: superagents-agents
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun test
      - run: docker build -t liege-superagents-agents:ci .
