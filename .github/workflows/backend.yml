name: Backend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    if: github.repository == 'liegeagents/liegeagentsapp'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: liege
          POSTGRES_PASSWORD: liege
          POSTGRES_DB: liege_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U liege -d liege_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://liege:liege@localhost:5432/liege_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Gitleaks scans the pushed commit range, so its baseline must be present.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run format:check
      - run: bun run test
      - name: Scan dependencies and code
        uses: returntocorp/semgrep-action@713efdd345f3035192eaa63f56867b88e63e4e5d # v1
        with:
          config: p/default
      - name: Scan committed history for credentials
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-push:
    if: github.repository == 'liegeagents/liegeagentsapp' && github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-api" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./backend
          push: true
          build-args: GIT_SHA=${{ github.sha }}
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}

  deploy:
    if: github.repository == 'liegeagents/liegeagentsapp' && github.event_name == 'push'
    needs: build-push
    runs-on: ubuntu-latest
    # Approval rules for production are configured on this environment in the repository settings.
    environment: production
    steps:
      - name: Deploy and wait for the new commit to serve
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          BACKEND_URL: ${{ vars.BACKEND_URL }}
          EXPECTED_CHAIN_ID: ${{ vars.EXPECTED_CHAIN_ID }}
          EXPECTED_USDG_TOKEN_ADDRESS: ${{ vars.EXPECTED_USDG_TOKEN_ADDRESS }}
          EXPECTED_ESCROW_MODE: ${{ vars.EXPECTED_ESCROW_MODE }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "No deploy hook configured; skipping deployment."
            exit 0
          fi
          curl --fail --silent --show-error --request POST "$DEPLOY_HOOK"
          if [ -z "$BACKEND_URL" ]; then
            echo "::warning::BACKEND_URL is not set, so the deployment was not verified."
            exit 0
          fi
          for attempt in $(seq 1 60); do
            commit=$(curl --silent --max-time 5 "$BACKEND_URL/health" | jq -r '.commit // empty' || true)
            config=$(curl --silent --max-time 5 "$BACKEND_URL/health/config" || true)
            if [ "$commit" = "$GITHUB_SHA" ] && \
              curl --fail --silent --max-time 5 "$BACKEND_URL/health/ready" > /dev/null && \
              [ "$(printf '%s' "$config" | jq -r '.chainId')" = "$EXPECTED_CHAIN_ID" ] && \
              [ "$(printf '%s' "$config" | jq -r '.usdgTokenAddress // ""')" = "$EXPECTED_USDG_TOKEN_ADDRESS" ] && \
              [ "$(printf '%s' "$config" | jq -r '.escrowMode')" = "$EXPECTED_ESCROW_MODE" ]; then
              echo "Commit $GITHUB_SHA is serving and ready."
              exit 0
            fi
            sleep 10
          done
          echo "::error::Commit $GITHUB_SHA was not serving and ready at $BACKEND_URL within 10 minutes."
          exit 1

  release:
    if: github.repository == 'liegeagents/liegeagentsapp' && github.event_name == 'push'
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - id: tag
        run: echo "name=backend-$(date -u +%Y%m%d%H%M)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - run: git tag "${{ steps.tag.outputs.name }}" && git push origin "${{ steps.tag.outputs.name }}"
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          generate_release_notes: true
