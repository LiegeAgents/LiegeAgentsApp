name: TypeScript SDK

on:
  push:
    branches: [main]
    paths: ["typescript-sdk/**", ".github/workflows/typescript-sdk.yml"]
    tags: ["typescript-sdk-v*"]
  pull_request:
    paths: ["typescript-sdk/**", ".github/workflows/typescript-sdk.yml"]

permissions:
  contents: read

jobs:
  test:
    if: github.repository == 'liegeagents/liegeagentsapp'
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: typescript-sdk } }
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --ignore-scripts
      - run: bun run build
      - run: bun test

  publish:
    if: github.repository == 'liegeagents/liegeagentsapp' && startsWith(github.ref, 'refs/tags/typescript-sdk-v')
    needs: test
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    defaults: { run: { working-directory: typescript-sdk } }
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }
      - uses: actions/setup-node@v4
        with: { node-version: 22, registry-url: https://registry.npmjs.org }
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm install --global npm@latest
      - run: npm publish --provenance --access public
