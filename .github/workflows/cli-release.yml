name: CLI Release

on:
  push:
    tags: ["cli-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    if: github.repository == 'liegeagents/liegeagentsapp' && (startsWith(github.ref, 'refs/tags/cli-v') || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun test
      - run: bun src/index.ts --help
      - run: bun run package:smoke

  build:
    if: github.repository == 'liegeagents/liegeagentsapp' && (startsWith(github.ref, 'refs/tags/cli-v') || github.event_name == 'workflow_dispatch')
    needs: check
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: bun-linux-x64
            artifact: liege-linux-x86_64
          - os: ubuntu-latest
            target: bun-linux-arm64
            artifact: liege-linux-arm64
          - os: macos-13
            target: bun-darwin-x64
            artifact: liege-macos-x86_64
          - os: macos-latest
            target: bun-darwin-arm64
            artifact: liege-macos-arm64
          - os: windows-latest
            target: bun-windows-x64
            artifact: liege-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - run: bun build --compile src/index.ts --target=${{ matrix.target }} --outfile=${{ matrix.artifact }}
      - uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4
        with:
          name: ${{ matrix.artifact }}
          path: cli/${{ matrix.artifact }}
          retention-days: 1

  release:
    if: github.repository == 'liegeagents/liegeagentsapp' && (startsWith(github.ref, 'refs/tags/cli-v') || github.event_name == 'workflow_dispatch')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish artifact checksums
        run: |
          cd artifacts
          sha256sum liege-* > checksums.txt
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: artifacts/liege-*
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: artifacts/*
          generate_release_notes: true
