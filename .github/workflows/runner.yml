name: Runner

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/runner.yml"]
  pull_request:
    branches: [main]
    paths: ["backend/**", ".github/workflows/runner.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun test tests/runner.test.ts
      - name: Validate hardened worker image definition
        run: |
          grep -q '^USER bun$' runner.Dockerfile
          grep -q -- '--network=none' RUNNER-DEPLOYMENT.md
          grep -q -- '--cap-drop=ALL' RUNNER-DEPLOYMENT.md

  build-push:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-runner" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./backend
          file: ./backend/runner.Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}

  deploy:
    if: github.event_name == 'push'
    needs: build-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy and verify runner service
        env:
          DEPLOY_HOOK: ${{ secrets.RUNNER_RENDER_DEPLOY_HOOK_URL }}
          RUNNER_URL: ${{ vars.RUNNER_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "No runner deploy hook configured; skipping deployment."
            exit 0
          fi
          curl --fail --silent --show-error --request POST "$DEPLOY_HOOK"
          if [ -z "$RUNNER_URL" ]; then
            echo "::warning::RUNNER_URL is not set, so the deployment was not verified."
            exit 0
          fi
          for attempt in $(seq 1 60); do
            status=$(curl --silent --max-time 5 "$RUNNER_URL/health" | jq -r '.status // empty' || true)
            if [ "$status" = "ok" ]; then
              echo "Runner service is healthy."
              exit 0
            fi
            sleep 10
          done
          echo "::error::Runner service was not healthy at $RUNNER_URL within 10 minutes."
          exit 1
