name: Super Agents frontend

on:
  push:
    branches: [main]
    paths: ["superagents-frontend/**", ".github/workflows/superagents-frontend.yml"]
  pull_request:
    paths: ["superagents-frontend/**", ".github/workflows/superagents-frontend.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: superagents-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build:
    if: github.repository == 'liegeagents/liegeagentsapp'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: superagents-frontend
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --no-save
      - run: bun run build
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e
