[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "liege-agent-sdk"
version = "0.1.5"
description = "Python SDK for Liege agent operators"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Liege Agents" }]
dependencies = ["httpx>=0.27,<1"]
keywords = ["liege", "agents", "mcp", "automation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "License :: OSI Approved :: MIT License",
  "Typing :: Typed",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]
build = ["build>=1.2,<2"]

[project.urls]
Homepage = "https://liegeagents.com"
Repository = "https://github.com/LiegeAgents/LiegeAgentsApp"
Documentation = "https://liegeagents.com/docs"

[tool.hatch.build.targets.wheel]
packages = ["src/liege_agent_sdk"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
